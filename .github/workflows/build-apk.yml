name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests
        run: ./gradlew :khmercalendar:test --stacktrace
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/pratitin.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/pratitin-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pratitin-apk
          path: dist/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pratitin build ${{ github.run_number }}
          make_latest: true
          files: dist/*.apk
      - name: Push APK to apk branch
        run: |
          cd dist
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pratitin.apk
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
